name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VISION_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and verify APK
        id: apk
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VISION_KEYSTORE_BASE64 }}
          VISION_STORE_PASSWORD: ${{ secrets.VISION_STORE_PASSWORD }}
          VISION_KEY_ALIAS: ${{ secrets.VISION_KEY_ALIAS }}
          VISION_KEY_PASSWORD: ${{ secrets.VISION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" && -z "$VISION_STORE_PASSWORD" && -z "$VISION_KEY_ALIAS" && -z "$VISION_KEY_PASSWORD" ]]; then
            gradle --no-daemon assembleDebug
            echo "type=debug" >> "$GITHUB_OUTPUT"
            echo "path=app/build/outputs/apk/debug/*.apk" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent signing not configured. Debug APK may not update an existing installation."
          else
            : "${KEYSTORE_B64:?Missing signing secret}"
            : "${VISION_STORE_PASSWORD:?Missing store password}"
            : "${VISION_KEY_ALIAS:?Missing alias}"
            : "${VISION_KEY_PASSWORD:?Missing key password}"
            umask 077
            export VISION_KEYSTORE_PATH="$RUNNER_TEMP/vision-release.p12"
            trap 'rm -f "$VISION_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$VISION_KEYSTORE_PATH"
            unset KEYSTORE_B64
            gradle --no-daemon assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
            SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$SIGNER"
            "$SIGNER" verify --verbose --print-certs "$APK"
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "path=$APK" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Vision-IPTV-Pro-${{ steps.apk.outputs.type }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
