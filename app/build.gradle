plugins { id 'com.android.application' }

def ciVersion = (System.getenv('VISION_VERSION_CODE') ?: '1').toInteger()
def signingPath = System.getenv('VISION_KEYSTORE_PATH')
android {
    namespace 'com.vision.iptv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vision.iptv'
        minSdk 24
        targetSdk 34
        versionCode = ciVersion
        versionName '0.1'
    }
    if (signingPath) {
        signingConfigs {
            visionRelease {
                storeFile = file(signingPath)
                storePassword = System.getenv('VISION_STORE_PASSWORD')
                keyAlias = System.getenv('VISION_KEY_ALIAS')
                keyPassword = System.getenv('VISION_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.visionRelease } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
